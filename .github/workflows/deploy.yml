name: GitHub Pages'e yayınla

on:
  push:
    branches:
      - main
      - claude/90-day-camp-tracker-jhfafk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; devam edeni iptal etme
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not: Pages'in repoda açık olması gerekir. Akıştaki GITHUB_TOKEN Pages
      # sitesini kendisi oluşturamıyor (Resource not accessible by integration),
      # bu yüzden bir kereye mahsus Settings > Pages > Source = GitHub Actions
      # seçilmelidir.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
